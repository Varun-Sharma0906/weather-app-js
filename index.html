<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container my-5 mx-auto text-center">
    <header>
        <h1 class="fs-1">NINJA WEATHER</h1>
        <form class="inputForm">
            <label class="text-muted my-3 fs-5 d-block" for="city">Enter a location for weather information</label>
            <input type="text" name="city" class="inpCity form-control">
        </form>
    </header>

    <div class="card shadow-lg rounded my-5 d-none">
        <img src="https://placehold.co/400x300" class="time card-img-top">
        <div class="icon bg-light mx-auto text-center">
            <img src="" alt="">
        </div>
        <div class="text-muted text-uppercase text-center details">
            <h5 class="my-3">City name</h5>
            <div class="my-3">Weather Condition</div>
            <div class="display-4 my-4">
                <span>temp</span>
                <span>&deg;C</span>
            </div>
        </div>
    </div>

</div>

<script src="scripts/forecast.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
